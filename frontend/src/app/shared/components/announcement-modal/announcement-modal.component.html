<div class="ann-backdrop">
  <div class="ann-modal" role="dialog" aria-modal="true" aria-labelledby="ann-title">

    <div class="ann-header">
      <i class="fas fa-bullhorn ann-icon"></i>
      <span id="ann-title">{{ title }}</span>
    </div>

    <div class="ann-body">
      <div class="ann-content" [innerHTML]="html"></div>
    </div>

    <div class="ann-footer">
      <button type="button" class="ann-dismiss-btn" (click)="dismissed.emit()">
        Got it
      </button>
    </div>

  </div>
</div>
