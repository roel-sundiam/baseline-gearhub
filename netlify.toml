[build]
  # Build from the frontend base so the command runs inside `frontend`.
  base = "frontend"
  command = "npm ci && npm run build"
  publish = "dist/frontend/browser"
  # Functions live at the repository `netlify/functions` directory.
  functions = "netlify/functions"

[dev]
  framework  = "#custom"
  command    = "cd frontend && ng serve --port 4200"
  targetPort = 4200
  port       = 8888
  publish    = "frontend/dist/frontend/browser"

[functions]
  node_bundler = "esbuild"
  external_node_modules = ["mongoose"]

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
