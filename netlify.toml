[build]
  # Explicitly set base to repo root
  base = "."
  # Build from repo root, run build in frontend directory
  command = "cd frontend && npm ci && npm run build"
  publish = "frontend/dist/frontend/browser"
  # Functions at repo root level
  functions = "netlify/functions"

[dev]
  framework  = "#custom"
  command    = "cd frontend && ng serve --port 4200"
  targetPort = 4200
  port       = 8888
  publish    = "frontend/dist/frontend/browser"

[functions]
  node_bundler = "esbuild"
  external_node_modules = ["mongoose"]

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
